[package]
name = "gm"
version = "0.1.0"
edition = "2021"
description = "Ferramenta de GM: procura item e entrega no inventário, direto no banco"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
# Mesmo leitor de tabela e de textura que o visualizador usa. Se divergissem,
# a ferramenta mostraria uma coisa e entregaria outra.
visualizador = { path = "../../visualizador/src-tauri" }

[profile.release]
opt-level = 2
