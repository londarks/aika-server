[package]
name = "aika-server"
version = "0.1.0"
edition.workspace = true
description = "Aika Online server: token (HTTP), login and game services"

[lib]
name = "aika_server"
path = "src/lib.rs"

[[bin]]
name = "aika-server"
path = "src/main.rs"

[dependencies]
aika-data = { path = "../aika-data" }
aika-net = { path = "../aika-net" }
anyhow = "1"
# Only for the wall clock 0x202 answers with. It has to be the server machine's
# own local time, which std cannot give and which the `time` crate refuses to
# work out from a threaded process.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4"
md-5 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "mysql", "any", "macros"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
