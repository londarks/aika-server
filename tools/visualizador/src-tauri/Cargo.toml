[package]
name = "visualizador"
version = "0.1.0"
edition = "2021"
description = "Navegador de itens do Aika: tabela do servidor + sprites do cliente"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[profile.release]
opt-level = 2
